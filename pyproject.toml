[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxify"
dynamic = ["version"]
description = "Convert messy enterprise files into clean, token-optimized context for LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Ajith", email = "ajlikeadj@users.noreply.github.com" }]
keywords = ["llm", "markdown", "csv", "json", "docx", "token", "context", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = []  # core is stdlib-only by design; heavy parsers live in extras

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
csv = ["charset-normalizer>=3.3"]
docx = ["python-docx>=1.1", "defusedxml>=0.7"]
all = ["ctxify[tokens,csv,docx]"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyyaml>=6",
    "ctxify[all]",
]

[project.urls]
Homepage = "https://github.com/Ajlikeadj/ctxify"
Repository = "https://github.com/Ajlikeadj/ctxify"
Issues = "https://github.com/Ajlikeadj/ctxify/issues"

[project.scripts]
ctxify = "ctxify.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ctxify.__version__" }

[tool.setuptools.packages.find]
include = ["ctxify*"]

[tool.setuptools.package-data]
ctxify = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error::DeprecationWarning:ctxify.*"]

[tool.coverage.run]
branch = true
source = ["ctxify"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "pragma: no cover", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["ctxify"]

[[tool.mypy.overrides]]
module = ["tiktoken", "defusedxml.*", "charset_normalizer.*"]
ignore_missing_imports = true
