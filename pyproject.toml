[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxify"
dynamic = ["version"]
description = "Convert messy enterprise files into clean, token-optimized context for LLMs."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # core is stdlib-only by design; heavy parsers live in extras

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
csv = ["charset-normalizer>=3.3"]
json = ["ijson>=3.2"]
docx = ["defusedxml>=0.7"]
pdf = ["pdfplumber>=0.11"]
ocr = ["pytesseract>=0.3", "pillow>=10"]
all = ["ctxify[tokens,csv,json,docx,pdf]"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pyyaml>=6", "reportlab>=4", "python-docx>=1.1", "ctxify[tokens,csv,json,docx,pdf]"]

[project.scripts]
ctxify = "ctxify.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ctxify.__version__" }

[tool.setuptools.packages.find]
include = ["ctxify*"]

[tool.setuptools.package-data]
ctxify = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
